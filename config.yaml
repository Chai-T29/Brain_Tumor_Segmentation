seed: 42

data:
  data_dir: "MU-Glioma-Post/"
  batch_size: 128
  num_workers: 8
  persistent_workers: true
  pin_memory: false
  prefetch_factor: 4
  val_split: 0.3
  test_split: 0.1
  include_empty_masks: false
  embedding_device: "mps"

encoder:
  name: "efficientnet_b0"
  pretrained: true
  trainable: false
  embedding_noise_std: 0.01

environment:
  num_sides: 32
  max_steps: 100
  iou_threshold: 0.7
  initial_radius: 90.0
  radial_step_scale: 8.0
  rotation_step_scale_deg: 12.0
  length_step_scale: 6.0
  stop_action_threshold: 0.6
  reward_success: 4.0
  reward_no_tumor: 2.0
  reward_false_stop: -3.0
  time_penalty: 0.02
  hold_penalty: 0.5

algorithm:
  gamma: 0.99
  n_step: 3
  tau: 0.005
  actor_lr: 0.0001
  critic_lr: 0.0001
  policy_delay: 2
  exploration_noise:
    sigma_init: 1.0
    sigma_final: 0.1
    steps: 500000
  target_policy_noise_std: 0.2
  target_policy_noise_clip: 0.5
  max_grad_norm: 10.0
  embedding_noise_std: 0.01
  actor_hidden_sizes: [512, 256]
  critic_hidden_sizes: [512, 256]
  replay_capacity: 300000

training:
  max_epochs: 40
  precision: "32-true"
  update_batch_size: 256
  update_every_n_steps: 4
  collect_steps_per_batch: 50
  warmup_steps: 1000
  log_interval: 50

logging:
  log_dir: "lightning_logs"
  logger_name: "td3_agent"
  checkpoint_dir: "checkpoints"
  test_gif_limit: 10
  test_gif_dir: "lightning_logs/test_gifs"
  test_gif_fps: 4
  early_stopping_patience: 20
