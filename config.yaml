seed: 42
verbose: false

data:
  data_dir: "MU-Glioma-Post/"
  batch_size: 16
  num_workers: 8
  persistent_workers: true
  pin_memory: false
  prefetch_factor: 4
  val_split: 0.3
  test_split: 0.2
  include_empty_masks: false
  embedding_device: "mps"

encoder:
  name: "efficientnet_b0"
  pretrained: true
  trainable: false
  embedding_noise_std: 0.01

environment:
  num_sides: 16
  max_steps: 60
  iou_low_threshold: 0.2
  iou_high_threshold: 0.6
  initial_radius: 90.0
  line_distance_step_scale: 5.0
  line_angle_step_scale_deg: 5.0
  center_step_scale: 4.0
  line_max_angle_offset_deg: 45.0
  line_min_distance: 0.0
  line_max_distance_margin: 1.0
  reward_success: 4.0
  reward_no_tumor: 2.0
  reward_false_stop: -3.0
  time_penalty: 0.02
  hold_penalty: 0.5

algorithm:
  gamma: 0.99
  n_step: 3
  tau: 0.005
  actor_lr: 0.001
  critic_lr: 0.001
  policy_delay: 1
  exploration_noise:
    sigma_init: 0.3
    sigma_final: 0.05
    steps: 1000000
  target_policy_noise_std: 0.1
  target_policy_noise_clip: 0.3
  max_grad_norm: 10.0
  embedding_noise_std: 0.0
  embedding_projected_dim: 1280
  pr_alpha: 0.6
  pr_beta_start: 0.4
  pr_beta_steps: 200000
  pr_eps: 1.0e-6
  actor_hidden_sizes: [512, 256]
  critic_hidden_sizes: [512, 256]
  replay_capacity: 300000
  # guidance_mode options: "critic_guidance", "true_guidance", "mixed", "true_guidance_post_noise", "random_true_guidance"
  guidance_mode: "random_true_guidance"
  mixed_guidance_steps: 1500000  # number of environment interactions before switching to critic-guided actions
  guidance_schedule:
    scale_init: 0.7
    scale_final: 0.3
    steps: 2000000
  guided_actor_loss: false
  guided_actor_loss_weight: 0.5
  actor_lr_schedule:
    lr_init: 0.001
    lr_final: 0.0001
    steps: 10  # number of epochs to reach lr_final
  critic_lr_schedule:
    lr_init: 0.001
    lr_final: 0.0001
    steps: 10

training:
  max_epochs: 40
  precision: "32-true"
  update_batch_size: 256
  update_every_n_steps: 1
  collect_steps_per_batch: 50
  warmup_steps: 1000
  log_interval: 1

logging:
  log_dir: "lightning_logs"
  logger_name: "td3_agent"
  checkpoint_dir: "checkpoints"
  test_gif_limit: 10
  test_gif_dir: "lightning_logs/test_gifs"
  test_gif_fps: 4
  early_stopping_patience: 20
