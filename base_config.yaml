seed: 42

data:
  data_dir: "MU-Glioma-Post/"
  batch_size: 24
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  val_split: 0.2
  test_split: 0.1
  include_empty_masks: false

encoder:
  name: "efficientnet_b0"
  pretrained: true
  trainable: false
  embedding_noise_std: 0.02

environment:
  num_sides: 32
  max_steps: 60
  iou_low_threshold: 0.2
  iou_high_threshold: 0.75
  initial_radius: 88.0
  line_distance_step_scale: 4.0
  line_angle_step_scale_deg: 6.0
  line_max_angle_offset_deg: 45.0
  line_min_distance: 0.0
  line_max_distance_margin: 1.0
  reward_success: 4.0
  reward_no_tumor: 2.0
  reward_false_stop: -3.0
  time_penalty: 0.02
  hold_penalty: 0.5

algorithm:
  gamma: 0.99
  n_step: 3
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  policy_delay: 2
  exploration_noise:
    sigma_init: 1.0
    sigma_final: 0.1
    steps: 500000
  target_policy_noise_std: 0.2
  target_policy_noise_clip: 0.5
  max_grad_norm: 10.0
  embedding_noise_std: 0.02
  embedding_projected_dim: 512
  pr_alpha: 0.6
  pr_beta_start: 0.4
  pr_beta_steps: 200000
  pr_eps: 1.0e-6
  replay_capacity: 200000

training:
  max_epochs: 60
  precision: "32-true"
  update_batch_size: 256
  update_every_n_steps: 2
  collect_steps_per_batch: 60
  warmup_steps: 2000
  log_interval: 50

logging:
  log_dir: "lightning_logs"
  logger_name: "td3_agent"
  checkpoint_dir: "checkpoints"
  test_gif_limit: 10
  test_gif_dir: "lightning_logs/test_gifs"
  test_gif_fps: 4
  early_stopping_patience: 20
